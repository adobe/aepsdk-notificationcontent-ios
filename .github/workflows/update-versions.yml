name: Update Versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The new version to use for the AEPNotificationContent extension (ex: 1.2.3).'
        type: string
        required: true

      branch:
        description: 'The target branch where the version update will be applied and the pull request will be merged into.'
        type: string
        required: true

jobs:
  update-versions:
    permissions:
      contents: write
      pull-requests: write
    uses: adobe/aepsdk-commons/.github/workflows/versions.yml@gha-ios-5.3.0
    with:
      version: ${{ github.event.inputs.version }}
      branch: ${{ github.event.inputs.branch }}
      paths: AEPNotificationContent.podspec, AEPNotificationContent.xcodeproj/project.pbxproj, AEPNotificationContent/Sources/Constants.swift
      update: true