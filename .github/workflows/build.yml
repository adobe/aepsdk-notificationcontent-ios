# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "staging", "dev-v*", "dev-ios27" ]
  pull_request:
    branches: [ "main", "staging", "dev-v*", "dev-ios27" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: xcode-27
    
    steps:
      - uses: actions/checkout@v3
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
  
      - name: Install swiftformat
        run: brew install swiftformat

      - name: pod install
        run: make pod-install
         
      - name: Linting
        run: make lint

      - name: Preboot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices "iOS 27.0" available | grep -m1 -E "^ +iPhone 18 Pro \(" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
  
      - name: Run tests
        run: make test
  
      # - name: Upload Code Coverage 
      #   uses: codecov/codecov-action@v3
      #   with:
      #     verbose: true
      #     name: aep-notificationcontent-ios
      #     move_coverage_to_trash: true

  build-swift6:
    needs: build
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v3
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: pod install
        run: make pod-install

      - name: Build AEPNotificationContent in Swift 6 language mode (dependencies keep their modes)
        run: make build-swift6

      - name: Build Swift 6 consumer (subclass and content extension calls from @MainActor)
        run: make test-swift6-consumer

  build-min-toolchain:
    needs: build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v3
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: pod install
        run: make pod-install

      - name: Build SDK on minimum supported toolchain (Xcode 15.4 / Swift 5.10)
        run: make build-min-toolchain
